<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Seterra – krainy geograficzne Polski</title>
<style>
:root{
  --bg:#0f172a; --card:#111c33; --text:#f8fafc; --muted:#a9b5ca;
  --accent:#7c3aed; --good:#22c55e; --bad:#ef4444; --line:#263552;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:linear-gradient(135deg,#0b1020,#18243e);
  color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
.wrap{max-width:1100px;margin:auto;padding:24px 16px 40px}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:clamp(24px,4vw,38px);margin:0}
.sub{color:var(--muted);margin-top:5px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:rgba(17,28,51,.9);border:1px solid var(--line);border-radius:14px;padding:9px 13px;min-width:90px;text-align:center}
.stat b{display:block;font-size:19px}.stat span{font-size:12px;color:var(--muted)}
.panel{background:rgba(17,28,51,.94);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.question{font-size:20px;font-weight:700;text-align:center;margin:0 0 12px}
.question strong{color:#c4b5fd}
#feedback{text-align:center;min-height:27px;font-weight:700;margin:4px 0 10px}
.map-shell{display:flex;justify-content:center}
.map{
  position:relative;width:min(720px,100%);aspect-ratio:720/705;
  background:#fff;border-radius:14px;overflow:hidden;border:2px solid #d7deeb;
  user-select:none;
}
.map img{width:100%;height:100%;display:block;object-fit:cover}
.hit{
  position:absolute; transform:translate(-50%,-50%); width:48px;height:48px;
  border:2px solid transparent;border-radius:50%;background:rgba(124,58,237,.02);
  cursor:pointer; transition:.12s; outline:none;
}
.hit:hover{background:rgba(124,58,237,.18);border-color:rgba(124,58,237,.65);transform:translate(-50%,-50%) scale(1.08)}
.hit:focus-visible{border-color:#fff;box-shadow:0 0 0 4px #7c3aed}
.hit.correct{background:rgba(34,197,94,.55);border-color:#16a34a}
.hit.wrong{background:rgba(239,68,68,.5);border-color:#dc2626}
.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button.action{
  border:0;border-radius:12px;padding:10px 15px;background:#243453;color:#fff;
  font-weight:700;cursor:pointer
}
button.action:hover{filter:brightness(1.12)}
button.primary{background:var(--accent)}
.small{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.modal{
  position:fixed;inset:0;background:rgba(3,7,18,.78);display:none;align-items:center;justify-content:center;padding:20px;
}
.modal.show{display:flex}
.modal-card{max-width:520px;width:100%;background:#111c33;border:1px solid #344666;border-radius:22px;padding:24px;text-align:center}
.modal-card h2{margin-top:0;font-size:30px}
.final-score{font-size:48px;font-weight:900;color:#c4b5fd}
kbd{background:#273652;border:1px solid #3d4e6c;border-radius:6px;padding:2px 6px}
@media(max-width:600px){
  .wrap{padding:14px 10px 28px}
  .panel{padding:10px}
  .hit{width:42px;height:42px}
  .question{font-size:17px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>🇵🇱 Krainy geograficzne Polski</h1>
    <div class="sub">Quiz w stylu Seterra • kliknij właściwy numer na mapie</div>
  </div>
  <div class="stats">
    <div class="stat"><b id="score">0</b><span>punkty</span></div>
    <div class="stat"><b id="progress">0/20</b><span>postęp</span></div>
    <div class="stat"><b id="streak">0</b><span>seria</span></div>
  </div>
</header>

<div class="panel">
  <p class="question">Znajdź na mapie: <strong id="target">—</strong></p>
  <div id="feedback"></div>

  <div class="map-shell">
    <div class="map" id="map"></div>
  </div>

  <div class="controls">
    <button class="action primary" id="skip">Pomiń</button>
    <button class="action" id="restart">Restart</button>
  </div>
  <div class="small">Kliknij numer odpowiadający wskazanej krainie. <kbd>Enter</kbd> = następne pytanie.</div>
</div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2>Koniec quizu! 🎉</h2>
    <div class="final-score" id="finalScore">0/20</div>
    <p id="finalText"></p>
    <button class="action primary" id="again">Zagraj jeszcze raz</button>
  </div>
</div>

const map = document.getElementById("map");
const target = document.getElementById("target");
const feedback = document.getElementById("feedback");
const scoreEl = document.getElementById("score");
const progressEl = document.getElementById("progress");
const streakEl = document.getElementById("streak");
const modal = document.getElementById("modal");
const finalScore = document.getElementById("finalScore");
const finalText = document.getElementById("finalText");

let order=[], current=0, score=0, streak=0, locked=false;

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function makeMap(){
  map.innerHTML="";
  const img=document.createElement("img");
  img.src=MAP_SRC;
  img.alt="Mapa krain geograficznych Polski";
  map.appendChild(img);
  DATA.forEach(d=>{
    const b=document.createElement("button");
    b.className="hit";
    b.dataset.id=d.id;
    b.title="Numer "+d.id;
    b.setAttribute("aria-label","Numer "+d.id);
    b.style.left=(d.x/720*100)+"%";
    b.style.top=(d.y/705*100)+"%";
    b.addEventListener("click",()=>pick(d.id,b));
    map.appendChild(b);
  });
}
function start(){
  order=shuffle(DATA.map(d=>d.id));
  current=0; score=0; streak=0; locked=false;
  modal.classList.remove("show");
  update();
  ask();
}
function update(){
  scoreEl.textContent=score;
  progressEl.textContent=current+"/20";
  streakEl.textContent=streak;
}
function ask(){
  if(current>=20){finish();return}
  locked=false;
  const id=order[current];
  const d=DATA.find(x=>x.id===id);
  target.textContent=d.name;
  feedback.textContent="";
  feedback.style.color="";
  document.querySelectorAll(".hit").forEach(x=>x.classList.remove("correct","wrong"));
  update();
}
function pick(id,btn){
  if(locked)return;
  locked=true;
  const wanted=order[current];
  if(id===wanted){
    score++; streak++;
    btn.classList.add("correct");
    feedback.textContent="✓ Dobrze!";
    feedback.style.color="var(--good)";
    current++;
    update();
    setTimeout(ask,500);
  }else{
    streak=0;
    btn.classList.add("wrong");
    const right=document.querySelector('.hit[data-id="'+wanted+'"]');
    right.classList.add("correct");
    const d=DATA.find(x=>x.id===wanted);
    feedback.textContent="✗ To nie to — poprawna odpowiedź: numer "+wanted+" ("+d.name+").";
    feedback.style.color="var(--bad)";
    current++;
    update();
    setTimeout(ask,1100);
  }
}
function skip(){
  if(locked)return;
  locked=true; streak=0;
  const wanted=order[current];
  const right=document.querySelector('.hit[data-id="'+wanted+'"]');
  right.classList.add("correct");
  const d=DATA.find(x=>x.id===wanted);
  feedback.textContent="Pominięto — numer "+wanted+" ("+d.name+").";
  feedback.style.color="#fbbf24";
  current++;
  update();
  setTimeout(ask,900);
}
function finish(){
  finalScore.textContent=score+"/20";
  finalText.textContent = score===20 ? "Perfekcyjny wynik!" :
    score>=16 ? "Bardzo dobry wynik!" :
    score>=11 ? "Nieźle — jeszcze kilka powtórek i będzie super." :
    "Warto zrobić jeszcze jedną rundę i utrwalić położenie krain.";
  modal.classList.add("show");
}
document.getElementById("skip").onclick=skip;
document.getElementById("restart").onclick=start;
document.getElementById("again").onclick=start;
document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !modal.classList.contains("show") && locked) ask();
});
makeMap();
start();
</script>
