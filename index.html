<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz – krainy geograficzne Polski</title>
<style>
:root {
  --bg:#f4f7fb; --card:#fff; --text:#172033; --muted:#687386;
  --accent:#2563eb; --good:#15803d; --bad:#dc2626; --border:#d9e0ea;
}
* { box-sizing:border-box; }
body {
  margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text);
}
.wrap { max-width:1050px; margin:auto; padding:22px; }
h1 { margin:0 0 6px; font-size:clamp(24px,4vw,36px); }
.subtitle { color:var(--muted); margin:0 0 18px; }
.card {
  background:var(--card); border:1px solid var(--border); border-radius:18px;
  padding:18px; box-shadow:0 8px 30px rgba(20,35,60,.07);
}
.controls {
  display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-bottom:15px;
}
button {
  border:1px solid var(--border); background:white; color:var(--text);
  padding:10px 14px; border-radius:10px; cursor:pointer; font-size:15px;
}
button:hover { border-color:#9bb3e8; }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
button.active { background:#e8efff; border-color:#8fb0ff; color:#1747a3; font-weight:700; }
.stats { margin-left:auto; color:var(--muted); font-size:14px; }
.task {
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:12px 14px; border-radius:12px; background:#f7f9fc; margin-bottom:14px;
}
.task strong { font-size:20px; }
.feedback { min-height:25px; font-weight:650; }
.feedback.good { color:var(--good); }
.feedback.bad { color:var(--bad); }
.mapbox {
  position:relative; width:min(699px,100%); margin:0 auto; user-select:none;
}
.mapbox img { display:block; width:100%; height:auto; }
.hit {
  position:absolute; transform:translate(-50%,-50%);
  width:42px; height:42px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:16px; border:2px solid #2563eb;
  background:rgba(255,255,255,.94); color:#163d9c;
  cursor:pointer; box-shadow:0 2px 7px rgba(0,0,0,.18);
}
.hit:hover { transform:translate(-50%,-50%) scale(1.08); }
.hit.correct { background:#dcfce7; border-color:#16a34a; color:#166534; }
.hit.wrong { background:#fee2e2; border-color:#dc2626; color:#991b1b; }
.mask {
  position:absolute; transform:translate(-50%,-50%);
  width:48px; height:34px; border-radius:50%;
  background:rgba(255,255,255,.96);
  pointer-events:none;
}
.dot {
  position:absolute; transform:translate(-50%,-50%);
  width:22px; height:22px; border-radius:50%;
  background:#ef4444; border:4px solid white; box-shadow:0 2px 10px rgba(0,0,0,.35);
  pointer-events:none;
}
.inputrow { display:flex; gap:9px; width:100%; max-width:650px; }
input {
  flex:1; min-width:0; padding:12px 13px; border:1px solid var(--border);
  border-radius:10px; font-size:16px; outline:none;
}
input:focus { border-color:#6b93eb; box-shadow:0 0 0 3px #e8efff; }
.small { font-size:13px; color:var(--muted); }
.hidden { display:none !important; }
@media(max-width:650px) {
  .wrap { padding:12px; }
  .card { padding:12px; }
  .stats { width:100%; margin-left:0; }
  .hit { width:34px; height:34px; font-size:14px; }
  .mask { width:42px; height:29px; }
}
</style>
</head>

    <p class="small">W trybie 1 klikaj numer na mapie. W trybie 2 liczby są zasłonięte, a czerwona kropka wskazuje obszar.</p>

<script>
const DATA = {"regions": {"1": "Nizina Szczecińska", "2": "Pobrzeże Słowińskie", "3": "Żuławy Wiślane", "4": "Pojezierze Mazurskie", "5": "Pojezierze Pomorskie", "6": "Pojezierze Wielkopolskie", "7": "Nizina Podlaska", "8": "Polesie Lubelskie", "9": "Nizina Mazowiecka", "10": "Nizina Wielkopolska", "11": "Nizina Śląska", "12": "Sudety", "13": "Wyżyna Śląska", "14": "Wyżyna Krakowsko-Częstochowska", "15": "Wyżyna Małopolska", "16": "Wyżyna Lubelska", "17": "Kotlina Sandomierska", "18": "Karpaty", "19": "Tatry", "20": "Karkonosze"}, "points": {"1": {"x": 110, "y": 158}, "2": {"x": 222, "y": 94}, "3": {"x": 333, "y": 111}, "4": {"x": 469, "y": 157}, "5": {"x": 250, "y": 170}, "6": {"x": 202, "y": 275}, "7": {"x": 577, "y": 211}, "8": {"x": 575, "y": 331}, "9": {"x": 435, "y": 283}, "10": {"x": 240, "y": 335}, "11": {"x": 191, "y": 392}, "12": {"x": 151, "y": 431}, "13": {"x": 320, "y": 464}, "14": {"x": 353, "y": 420}, "15": {"x": 438, "y": 425}, "16": {"x": 570, "y": 402}, "17": {"x": 513, "y": 479}, "18": {"x": 462, "y": 528}, "19": {"x": 395, "y": 577}, "20": {"x": 124, "y": 424}}, "imageWidth": 699, "imageHeight": 1001};
let mode = 1, current = null, score = 0, asked = 0, streak = 0, locked = false;

const mapbox = document.getElementById('mapbox');
const promptEl = document.getElementById('prompt');
const feedbackEl = document.getElementById('feedback');
const inputArea = document.getElementById('inputArea');
const answerEl = document.getElementById('answer');
const scoreEl = document.getElementById('score');
const askedEl = document.getElementById('asked');
const streakEl = document.getElementById('streak');

function setMode(m) {
  mode = m;
  document.getElementById('mode1').classList.toggle('active', m === 1);
  document.getElementById('mode2').classList.toggle('active', m === 2);
  newQuestion();
}

function randomRegion() {
  const ids = Object.keys(DATA.regions).map(Number);
  if (ids.length === 1) return ids[0];
  let n;
  do { n = ids[Math.floor(Math.random()*ids.length)]; } while (n === current);
  return n;
}

function clearMap() {
  mapbox.querySelectorAll('.hit,.mask,.dot').forEach(e => e.remove());
}

function placeAt(el, id) {
  const p = DATA.points[String(id)];
  el.style.left = (p.x / DATA.imageWidth * 100) + '%';
  el.style.top = (p.y / DATA.imageHeight * 100) + '%';
  mapbox.appendChild(el);
}

function setupMap() {
  clearMap();
  if (mode === 1) {
    for (const id of Object.keys(DATA.regions).map(Number)) {
      const b = document.createElement('button');
      b.className = 'hit';
      b.textContent = id;
      b.title = DATA.regions[id];
      b.onclick = () => clickNumber(id, b);
      placeAt(b, id);
    }
  } else {
    for (const id of Object.keys(DATA.regions).map(Number)) {
      const m = document.createElement('div');
      m.className = 'mask';
      placeAt(m, id);
    }
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.id = 'questionDot';
    placeAt(dot, current);
  }
}

function newQuestion() {
  locked = false;
  current = randomRegion();
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  inputArea.classList.toggle('hidden', mode !== 2);
  if (mode === 1) {
    promptEl.textContent = 'Znajdź na mapie: ' + DATA.regions[current];
    answerEl.value = '';
  } else {
    promptEl.textContent = 'Jaka kraina geograficzna jest zaznaczona kropką?';
    answerEl.value = '';
    setTimeout(() => answerEl.focus(), 50);
  }
  setupMap();
}

function result(ok, message) {
  asked++;
  if (ok) {
    score++; streak++;
    feedbackEl.textContent = '✓ ' + message;
    feedbackEl.className = 'feedback good';
  } else {
    streak = 0;
    feedbackEl.textContent = '✗ ' + message;
    feedbackEl.className = 'feedback bad';
  }
  scoreEl.textContent = score;
  askedEl.textContent = asked;
  streakEl.textContent = streak;
}

function clickNumber(id, el) {
  if (locked) return;
  locked = true;
  if (id === current) {
    el.classList.add('correct');
    result(true, 'Dobrze! ' + DATA.regions[current] + ' to numer ' + current + '.');
  } else {
    el.classList.add('wrong');
    const correct = [...mapbox.querySelectorAll('.hit')].find(x => Number(x.textContent) === current);
    if (correct) correct.classList.add('correct');
    result(false, 'Poprawna odpowiedź: numer ' + current + ' — ' + DATA.regions[current] + '.');
  }
}

function normalize(s) {
  return s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[–—-]/g,' ')
    .replace(/[^a-z0-9ąćęłńóśźż ]/gi,' ')
    .replace(/\s+/g,' ').trim();
}

function checkText() {
  if (locked) return;
  const typed = normalize(answerEl.value);
  const correct = normalize(DATA.regions[current]);
  if (!typed) return;
  locked = true;
  if (typed === correct) {
    result(true, 'Dobrze! To ' + DATA.regions[current] + '.');
  } else {
    result(false, 'Poprawna odpowiedź: ' + DATA.regions[current] + '.');
  }
}

answerEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') checkText();
});
newQuestion();
</script>
